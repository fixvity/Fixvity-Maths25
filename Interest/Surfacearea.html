<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Surface Area Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --primary:#2563eb;
  --bg:#f4f7fb;
  --card:#ffffff;
  --radius:14px;
}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}
.container{
  max-width:1100px;
  margin:auto;
  padding:22px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h1{
  color:var(--primary);
  margin-top:0;
}
label{
  font-weight:600;
  margin-top:16px;
  display:block;
}
input,select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}
button{
  width:100%;
  margin-top:22px;
  padding:15px;
  font-size:17px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
}
button:hover{opacity:.9}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:28px;
  margin-top:28px;
}
.result{
  font-size:20px;
  font-weight:700;
}
.formula{
  font-size:16px;
  color:#444;
}
.error{
  color:#dc2626;
  font-weight:600;
}
small{color:#555}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>Surface Area Calculator</h1>
    <small>Accurate surface area calculation for 3D shapes · International standards</small>

    <label>Shape</label>
    <select id="shape">
      <option value="cube">Cube</option>
    </select>

    <label>Unit</label>
    <select id="unit">
      <option value="mm²">mm²</option>
      <option value="cm²" selected>cm²</option>
      <option value="m²">m²</option>
      <option value="in²">in²</option>
      <option value="ft²">ft²</option>
      <option value="yd²">yd²</option>
    </select>

    <label>Side (a)</label>
    <input type="number" id="a" placeholder="Enter side length" step="any">

    <button onclick="calculate()">Calculate Surface Area</button>
    <div id="error" class="error"></div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="result" id="output">Surface Area = —</div>
    </div>
    <div class="card">
      <div class="formula">
        <b>Formula Used</b><br><br>
        6a²
      </div>
    </div>
  </div>
</div>

<script>
function calculate(){
  const a = parseFloat(document.getElementById("a").value);
  const unit = document.getElementById("unit").value;
  const error = document.getElementById("error");

  error.innerText = "";

  if(isNaN(a) || a <= 0){
    error.innerText = "Please enter a valid side length greater than 0.";
    document.getElementById("output").innerText = "Surface Area = —";
    return;
  }

  const area = 6 * a * a;
  document.getElementById("output").innerText =
    `Surface Area = ${area.toFixed(6)} ${unit}`;
}
</script>
</body>
</html>
